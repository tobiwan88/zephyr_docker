name: Build and Publish Zephyr Docker Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zephyr_version:
        description: 'Zephyr version to build'
        required: false
        default: 'v4.3.0'
        type: string
      toolchain_version:
        description: 'Toolchain version to build'
        required: false
        default: '0.17.4'
        type: string
      debian_version:
        description: 'Debian base version'
        required: false
        default: 'trixie-slim'
        type: string
      toolchains:
        description: 'Toolchains to build (comma-separated or "all")'
        required: false
        default: 'arm-zephyr-eabi'
        type: string
      push_images:
        description: 'Push images to registry'
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual trigger - use provided inputs
            TOOLCHAINS="${{ github.event.inputs.toolchains }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            # Tag build - build comprehensive matrix
            TOOLCHAINS="arm-zephyr-eabi,riscv64-zephyr-elf"
          else
            # PR or regular push - build only ARM for faster feedback
            TOOLCHAINS="arm-zephyr-eabi"
          fi

          echo "Event name: ${{ github.event_name }}"
          echo "Ref type: ${{ github.ref_type }}"
          echo "Selected toolchains: $TOOLCHAINS"

          # Convert to JSON array - compact format for GitHub Actions
          MATRIX=$(echo "$TOOLCHAINS" | jq -R -c 'split(",") | map({toolchain: .})')
          echo "Generated matrix: $MATRIX"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build-and-publish:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h

          # Remove unnecessary packages and files
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          # Clean docker system
          docker system prune -af

          echo "After cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64
          driver-opts: |
            image=moby/buildkit:v0.12.3
            network=host
          config-inline: |
            [worker.oci]
              max-parallelism = 1
            [worker.containerd]
              max-parallelism = 1

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build environment
        run: |
          # Set versions from inputs or defaults
          echo "ZEPHYR_VERSION=${{ github.event.inputs.zephyr_version || 'v4.3.0' }}" >> $GITHUB_ENV
          echo "TOOLCHAIN_VERSION=${{ github.event.inputs.toolchain_version || '0.17.4' }}" >> $GITHUB_ENV
          echo "DEBIAN_VERSION=${{ github.event.inputs.debian_version || 'trixie-slim' }}" >> $GITHUB_ENV
          echo "TOOLCHAINS=${{ matrix.toolchain }}" >> $GITHUB_ENV

          # Determine if we should push and use multi-platform builds
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PUSH_IMAGES=false" >> $GITHUB_ENV
            # No PLATFORMS set for PRs - single platform build for testing
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PUSH_IMAGES=${{ github.event.inputs.push_images }}" >> $GITHUB_ENV
            echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
          else
            echo "PUSH_IMAGES=true" >> $GITHUB_ENV
            echo "PLATFORMS=linux/amd64,linux/arm64" >> $GITHUB_ENV
          fi

      - name: Generate image metadata
        id: meta
        run: |
          # Generate base image name
          BASE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Generate tag based on toolchain
          if [ "${{ matrix.toolchain }}" = "all" ]; then
            TAG_SUFFIX="latest"
          else
            TAG_SUFFIX=$(echo "${{ matrix.toolchain }}" | sed 's/-zephyr-eabi//g' | sed 's/-zephyr-elf//g')
          fi

          # Generate full tags
          TAGS="${BASE_NAME}:${TAG_SUFFIX}"

          # Add version tags for releases
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
            TAGS="${TAGS},${BASE_NAME}:${TAG_SUFFIX}-${VERSION}"
            if [ "${{ matrix.toolchain }}" = "all" ]; then
              TAGS="${TAGS},${BASE_NAME}:${VERSION}"
            fi
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image-name=${BASE_NAME}:${TAG_SUFFIX}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          echo "🏗️ Building image: ${{ steps.meta.outputs.image-name }}"

          # Monitor disk space during build
          echo "Disk space before build:"
          df -h

          # Use build script for consistency with CI optimizations
          chmod +x ./build.sh

          # Set registry prefix for the build script (without trailing colon)
          export REGISTRY_PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Enable BuildKit optimizations for CI
          export DOCKER_BUILDKIT=1
          export BUILDKIT_PROGRESS=plain

          # Build image with reduced parallelism and cache optimization
          # Use multi-platform build only when PLATFORMS is set (not for PRs)
          if [ -n "${PLATFORMS:-}" ]; then
            echo "🌐 Building multi-platform image for: ${PLATFORMS}"
            ./build.sh --ci --platforms "${PLATFORMS}"
          else
            echo "🏗️ Building single-platform image for testing"
            ./build.sh --ci
          fi

          echo "Disk space after build:"
          df -h

          # Clean up build cache to free space
          docker builder prune -f --filter type=exec.cachemount
          docker builder prune -f --filter type=regular

      - name: Test Docker image
        run: |
          # Use the same registry prefix to get the correct tag
          export REGISTRY_PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG=$(./build.sh --get-tag)
          echo "🧪 Testing image: ${IMAGE_TAG}"

          # Basic functionality tests
          # For multi-platform builds, we can't test locally since image was pushed
          # Skip local tests for multi-platform builds
          if [ -z "${PLATFORMS:-}" ]; then
            docker run --rm "${IMAGE_TAG}" west --version
            docker run --rm "${IMAGE_TAG}" cmake --version
            docker run --rm "${IMAGE_TAG}" python3 --version

            # Test GCC availability
            echo "Checking GCC installation..."
            docker run --rm "${IMAGE_TAG}" gcc --version

            # Test Zephyr SDK installation
            echo "Checking Zephyr SDK installation..."
            docker run --rm "${IMAGE_TAG}" ls -la /home/zephyr/zephyr-sdk
            docker run --rm "${IMAGE_TAG}" test -f /home/zephyr/zephyr-sdk/setup.sh

            # Test ARM toolchain availability
            echo "Checking ARM toolchain..."
            docker run --rm "${IMAGE_TAG}" ls -la /home/zephyr/zephyr-sdk/arm-zephyr-eabi
            docker run --rm "${IMAGE_TAG}" /home/zephyr/zephyr-sdk/arm-zephyr-eabi/bin/arm-zephyr-eabi-gcc --version
          else
            echo "⏩ Skipping local tests for multi-platform build (image already pushed to registry)"
          fi

      - name: Push Docker image
        if: env.PUSH_IMAGES == 'true'
        run: |
          # Use the same registry prefix to get the correct tag
          export REGISTRY_PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG=$(./build.sh --get-tag)

          # For multi-platform builds, we need to add additional tags after the image is built
          if [ -n "${PLATFORMS:-}" ]; then
            echo "📤 Multi-platform image already pushed with base tag: ${IMAGE_TAG}"

            # Add additional tags if there are multiple tags specified
            IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
            for tag in "${TAG_ARRAY[@]}"; do
              if [ "$tag" != "${IMAGE_TAG}" ]; then
                echo "🏷️ Adding additional tag: ${tag}"
                docker buildx imagetools create --tag "${tag}" "${IMAGE_TAG}"
              fi
            done
          else
            # Tag and push all variants for single-platform builds
            IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
            for tag in "${TAG_ARRAY[@]}"; do
              echo "🏷️ Tagging: ${IMAGE_TAG} -> ${tag}"
              docker tag "${IMAGE_TAG}" "${tag}"
              echo "📤 Pushing: ${tag}"
              docker push "${tag}"
            done
          fi

      - name: Output image information
        run: |
          # Use the same registry prefix to get the correct tag
          export REGISTRY_PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG=$(./build.sh --get-tag)
          echo "✅ Successfully built: ${IMAGE_TAG}"
          echo "📊 Image size: $(docker images "${IMAGE_TAG}" --format 'table {{.Size}}')"

          if [ "${{ env.PUSH_IMAGES }}" = "true" ]; then
            echo "📤 Published tags:"
            IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
            for tag in "${TAG_ARRAY[@]}"; do
              echo "  - ${tag}"
            done
          fi

  cleanup:
    if: always()
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup old packages
        if: github.event_name != 'pull_request'
        uses: actions/delete-package-versions@v4
        with:
          package-name: 'zephyr_docker'
          package-type: 'container'
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
        continue-on-error: true
